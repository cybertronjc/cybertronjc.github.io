<!DOCTYPE html>
<html>
<head>
    <title>Be My Valentine?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff6b6b, #ffd3d3);
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #ff4b4b;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            margin-bottom: 2rem;
            word-wrap: break-word;
        }

        .buttons {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            font-size: clamp(1rem, 4vw, 1.2rem);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
            min-width: 120px;
            touch-action: manipulation;
        }

        .btn-yes {
            background: #4CAF50;
            color: white;
        }

        .btn-yes:hover, .btn-yes:active {
            transform: scale(1.1);
        }

        .btn-no {
            background: #ff4b4b;
            color: white;
            position: relative;
        }

        /* Hearts background animation */
        @keyframes floatHeart {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .heart {
            position: fixed;
            font-size: clamp(1rem, 4vw, 1.5rem);
            user-select: none;
            pointer-events: none;
        }

        /* Success message styles */
        .success-message {
            font-size: clamp(1.2rem, 4vw, 2rem);
            margin-top: 1rem;
        }

        /* Media Queries */
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }

            .buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 80%;
                margin: 0.5rem 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Will You Be My Valentine? ❤️</h1>
        <div class="buttons">
            <button class="btn btn-yes" onclick="sayYes()">Yes</button>
            <button class="btn btn-no" ontouchstart="moveButton(this)" onmouseover="moveButton(this)">No</button>
        </div>
    </div>

    <script>
        function moveButton(button) {
            // Get container dimensions
            const container = document.querySelector('.container');
            const containerRect = container.getBoundingClientRect();
            
            // Generate random position within container bounds
            const maxX = containerRect.width - button.offsetWidth;
            const maxY = containerRect.height - button.offsetHeight;
            
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;
            
            // Keep button within container
            button.style.position = 'absolute';
            button.style.left = (containerRect.left + x) + 'px';
            button.style.top = (containerRect.top + y) + 'px';
        }

        function sayYes() {
            // Clear existing content
            document.body.innerHTML = `
                <div class="container">
                    <h1>Yay! I'm so happy! ❤️</h1>
                    <p class="success-message">Thank you for making my day special! 💖</p>
                </div>
            `;
            
            // Create floating hearts
            createHearts();
        }

        function createHearts() {
            const hearts = ['❤️', '💖', '💝', '💕', '💗'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                
                // Random starting position
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animation = `floatHeart ${3 + Math.random() * 3}s linear`;
                
                document.body.appendChild(heart);
                
                // Remove heart after animation
                setTimeout(() => {
                    heart.remove();
                }, 6000);
            }, 300);
        }
    </script>
</body>
</html>
